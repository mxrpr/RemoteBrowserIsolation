<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RBI Test Client</title>
  <style>
    /* Full-window layout: a slim toolbar on top, the remote-screen video filling everything else.
       The video element is CSS-sized to the available area; the actual stream resolution is
       whatever the server rendered. Input coordinates are converted from CSS space to stream
       space on send. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #toolbar { display: flex; gap: 8px; padding: 8px; box-sizing: border-box; height: 48px; background: #f4f4f4; }
    #url { flex: 1; }
    #screen { display: block; width: 100vw; height: calc(100vh - 48px); background: #222; outline: none; object-fit: contain; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input id="url" type="text" placeholder="https://example.com" value="https://example.com" />
    <button id="fetchBtn">Fetch</button>
  </div>
  <!-- The rendered page arrives as a VP8 video track; the browser plays it like any video call.
       tabindex makes the element focusable so keyboard events can be captured and forwarded. -->
  <video id="screen" autoplay muted playsinline tabindex="0"></video>

  <script>
    const video = document.getElementById('screen');

    // Session diagnostics go to the browser devtools console, not the page UI.
    function log(msg) {
      console.log('[rbi] ' + msg);
    }

    function waitForIceGatheringComplete(pc) {
      if (pc.iceGatheringState === 'complete') {
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        function check() {
          if (pc.iceGatheringState === 'complete') {
            pc.removeEventListener('icegatheringstatechange', check);
            resolve();
          }
        }
        pc.addEventListener('icegatheringstatechange', check);
      });
    }

    // Timestamp of the most recent input send, used to log input-to-visible-frame latency for
    // perf diagnosis (via requestVideoFrameCallback on the next composited video frame).
    let lastInputSentAt = 0;
    let lastInputType = null;

    // Converts mouse coordinates from CSS pixels (the video element's on-screen box) to stream
    // pixels (server page coordinates). object-fit: contain letterboxes the video inside the
    // element when aspect ratios differ, so the visible video's offset and scale inside the
    // element must be accounted for — a plain width ratio would misplace clicks in the bars.
    function toStreamCoords(e) {
      const elemW = video.clientWidth, elemH = video.clientHeight;
      const streamW = video.videoWidth, streamH = video.videoHeight;
      if (!streamW || !streamH) return null;
      const scale = Math.min(elemW / streamW, elemH / streamH);
      const shownW = streamW * scale, shownH = streamH * scale;
      const offX = (elemW - shownW) / 2, offY = (elemH - shownH) / 2;
      const x = (e.offsetX - offX) / scale;
      const y = (e.offsetY - offY) / scale;
      if (x < 0 || y < 0 || x > streamW || y > streamH) return null; // click in the letterbox bars
      return { x, y };
    }

    // Captures mouse/keyboard/scroll on the video element and forwards each as a small JSON
    // InputEvent over the input channel, to be replayed on the server-side rendered page.
    function wireInputCapture(inputChannel) {
      function send(event) {
        if (inputChannel.readyState === 'open') {
          lastInputSentAt = performance.now();
          lastInputType = event.type;
          inputChannel.send(JSON.stringify(event));
        }
      }

      // Native mousemove/wheel events fire far faster than the server can round-trip each one
      // through Playwright/CDP; coalescing to at most one message per animation frame keeps
      // input responsive instead of queuing a backlog of stale events. Discrete events
      // (down/up/key) stay uncoalesced since they're low-frequency and order/timing-sensitive.
      // No separate 'click' event is sent: the down/up pair IS the click (forwarding the
      // browser's synthesized click event too made the server replay two clicks).
      let pendingMove = null;
      let pendingWheel = null;
      let flushScheduled = false;

      function scheduleFlush() {
        if (flushScheduled) return;
        flushScheduled = true;
        requestAnimationFrame(() => {
          flushScheduled = false;
          if (pendingMove) { send(pendingMove); pendingMove = null; }
          if (pendingWheel) { send(pendingWheel); pendingWheel = null; }
        });
      }

      video.addEventListener('mousemove', (e) => {
        const pos = toStreamCoords(e);
        if (!pos) return;
        pendingMove = { type: 'mousemove', ...pos };
        scheduleFlush();
      });
      // Drop any coalesced move still pending: down/up carry their own coordinates, and a stale
      // move flushing between down and up would turn a plain click into an accidental drag.
      video.addEventListener('mousedown', (e) => {
        video.focus();
        const pos = toStreamCoords(e);
        if (!pos) return;
        pendingMove = null;
        send({ type: 'mousedown', ...pos });
      });
      video.addEventListener('mouseup', (e) => {
        const pos = toStreamCoords(e);
        if (!pos) return;
        pendingMove = null;
        send({ type: 'mouseup', ...pos });
      });
      video.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (pendingWheel) {
          pendingWheel.deltaX += e.deltaX;
          pendingWheel.deltaY += e.deltaY;
        } else {
          pendingWheel = { type: 'wheel', deltaX: e.deltaX, deltaY: e.deltaY };
        }
        scheduleFlush();
      }, { passive: false });
      video.addEventListener('keydown', (e) => { e.preventDefault(); send({ type: 'keydown', key: e.key }); });
      video.addEventListener('keyup', (e) => { e.preventDefault(); send({ type: 'keyup', key: e.key }); });
    }

    // The active session's peer connection; closed before starting a new one so re-fetching
    // doesn't leave the previous session streaming (and burning server resources) in the background.
    let activePc = null;

    document.getElementById('fetchBtn').onclick = async () => {
      const url = document.getElementById('url').value.trim();
      if (!url) return;

      if (activePc) {
        activePc.close();
        activePc = null;
      }

      log('Starting session for ' + url);

      const pc = new RTCPeerConnection();
      activePc = pc;

      // Receive-only video: the server answers with a send-only VP8 track carrying the rendered
      // page. Must be in the offer, since the answering side can't add new media sections.
      pc.addTransceiver('video', { direction: 'recvonly' });

      pc.ontrack = (event) => {
        log('Video track received');
        // Interactive stream, not a movie: ask the receiver to play frames out as soon as they
        // arrive instead of holding them in the jitter buffer for smoothness. Cuts 100ms+ of
        // input-to-glass latency; occasional micro-stutter on frame-rate dips is an acceptable
        // trade for a remote-control UI. (Both properties are hints; browsers clamp them.)
        if (event.receiver) {
          try { event.receiver.jitterBufferTarget = 0; } catch {}
          try { event.receiver.playoutDelayHint = 0; } catch {}
        }
        video.srcObject = event.streams[0] && event.streams[0].active !== undefined
          ? event.streams[0]
          : new MediaStream([event.track]);
        if ('requestVideoFrameCallback' in video) {
          const onFrame = () => {
            if (lastInputSentAt) {
              console.log(`[timing] frame after '${lastInputType}': ${(performance.now() - lastInputSentAt).toFixed(1)}ms`);
              lastInputSentAt = 0;
            }
            video.requestVideoFrameCallback(onFrame);
          };
          video.requestVideoFrameCallback(onFrame);
        }
      };

      // negotiated + fixed id: must match the id the server uses (see WebRtcSessionManager.cs) —
      // carries input events client -> server as JSON.
      const inputChannel = pc.createDataChannel('input-events', { negotiated: true, id: 1 });
      inputChannel.onopen = () => { log('Input channel open'); wireInputCapture(inputChannel); };
      inputChannel.onerror = (e) => log('Input channel error: ' + e.error);

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForIceGatheringComplete(pc);

        // Request a render size matching the video element's on-screen area, scaled down
        // (preserving aspect ratio) to fit the server's 1280x720 cap. object-fit: contain
        // letterboxes any residual mismatch instead of stretching.
        const availW = video.clientWidth;
        const availH = video.clientHeight;
        const fit = Math.min(1280 / availW, 720 / availH, 1);
        const reqW = Math.round(availW * fit);
        const reqH = Math.round(availH * fit);

        log('Sending offer to server...');
        const resp = await fetch('/api/session/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, sdp: pc.localDescription.sdp, width: reqW, height: reqH })
        });

        if (!resp.ok) {
          const err = await resp.json();
          log('Server error: ' + JSON.stringify(err));
          pc.close();
          return;
        }

        const { sdp: answerSdp } = await resp.json();
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        log('Remote description set, waiting for video...');
      } catch (e) {
        log('Error: ' + e.message);
        pc.close();
      }
    };
  </script>
</body>
</html>
