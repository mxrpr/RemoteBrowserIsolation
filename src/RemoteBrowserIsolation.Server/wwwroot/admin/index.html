<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RBI Admin</title>
  <style>
    /* Design tokens only — still a plain inline <style>, no framework/build step, matching the rest
       of this project's zero-dependency convention. Dark mode follows the OS preference; there's no
       JS-driven theme toggle since that'd be one more thing to wire up for an internal tool. */
    :root {
      --bg: #f3f4f7;
      --surface: #ffffff;
      --border: #e3e5ea;
      --text: #1a1d23;
      --text-muted: #6b7280;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-text: #ffffff;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --row-hover: #f8f8fc;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #191c22;
        --border: #2b2f38;
        --text: #e6e8ec;
        --text-muted: #9aa0ab;
        --primary: #6366f1;
        --primary-hover: #818cf8;
        --primary-text: #ffffff;
        --danger: #ef4444;
        --danger-hover: #f87171;
        --row-hover: #20242c;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #app { min-height: 100%; }

    h1 { font-size: 19px; font-weight: 600; margin: 0; }
    h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

    /* Login view: a single centered card over the full viewport height. */
    #loginBox:not(.hidden) { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; }
    .login-card {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .login-card h1 { margin-bottom: 4px; }
    #loginHint { color: var(--text-muted); font-size: 13px; margin: 4px 0 16px; line-height: 1.4; }
    #loginBox input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 9px 11px;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #loginBox input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
    /* #loginBox input's ID selector otherwise outweighs the plain .hidden class (same specificity
       trap that bit #screen/#htmlScreen in the main client) — this rule must win to actually hide
       the confirm-password field on a returning-admin login. */
    #loginBox input.hidden { display: none; }
    #loginError { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

    /* Main view. */
    #mainBox:not(.hidden) { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }

    .layout { display: flex; gap: 24px; align-items: flex-start; }
    .sidebar { width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 28px; }
    .nav-item {
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 10px 14px;
      font-size: 13px;
    }
    .nav-item:hover { background: var(--row-hover); color: var(--text); }
    .nav-item.active { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); color: var(--primary); }
    .content { flex: 1; min-width: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .table-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 9px 12px; font-size: 13px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--row-hover); }
    td { color: var(--text); }

    button {
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }
    button:hover { background: var(--row-hover); }
    button:active { transform: translateY(1px); }
    button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
    button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    button.danger { background: transparent; border-color: var(--border); color: var(--danger); }
    button.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

    select, #addSiteForm input {
      font: inherit;
      font-size: 13px;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    #addSiteForm { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
    #addSiteForm input { flex: 1; min-width: 160px; }

    .error-row { color: var(--danger); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Login view: shown until a token is obtained. -->
    <div id="loginBox">
      <div class="login-card">
        <h1>RBI Admin</h1>
        <div id="loginHint">Checking status...</div>
        <input id="email" type="email" placeholder="email" />
        <input id="password" type="password" placeholder="password" />
        <!-- Only shown/required on bootstrap (no admin yet) — a returning admin just needs one
             password field, confirmation only matters when this login call is about to create the
             account. -->
        <input id="passwordConfirm" type="password" placeholder="confirm password" class="hidden" />
        <button id="loginBtn" class="primary">Log in</button>
        <div id="loginError"></div>
      </div>
    </div>

    <!-- Main view: shown once logged in. -->
    <div id="mainBox" class="hidden">
      <div class="topbar">
        <h1>RBI Admin</h1>
        <button id="logoutBtn">Log out</button>
      </div>

      <div class="layout">
        <!-- Both sections stay mounted (and their data loaded) at all times; the nav just toggles
             which one is visible. Simpler than lazy-loading on nav click, and the data sets are
             small enough that eager-loading both up front isn't a real cost. -->
        <nav class="sidebar">
          <button class="nav-item active" data-section="policiesSection">Policies</button>
          <button class="nav-item" data-section="logsSection">Logs</button>
          <button class="nav-item" data-section="rootCaSection">Root CA</button>
          <button class="nav-item" data-section="settingsSection">Settings</button>
        </nav>

        <div class="content">
          <section class="card" id="policiesSection">
            <h2>Site policies</h2>
            <div class="table-wrap">
              <table id="sitesTable">
                <thead><tr><th>Host pattern</th><th>View mode</th><th>Updated</th><th></th></tr></thead>
                <tbody id="sitesBody"></tbody>
              </table>
            </div>
            <form id="addSiteForm">
              <input id="newHost" type="text" placeholder="example.com" required />
              <select id="newMode">
                <option>HtmlAllowInput</option>
                <option>HtmlNoInput</option>
                <option>VideoAllowInput</option>
                <option>VideoNoInput</option>
              </select>
              <button type="submit" class="primary">Add site</button>
            </form>
          </section>

          <section class="card hidden" id="logsSection">
            <h2>Request log</h2>
            <div class="table-wrap">
              <table id="logsTable">
                <thead><tr><th>Time (UTC)</th><th>Url</th><th>Host</th><th>Decision</th><th>Allowed</th><th>Client IP</th></tr></thead>
                <tbody id="logsBody"></tbody>
              </table>
            </div>
          </section>

          <!-- Root CA used by the TLS-intercepting proxy to mint per-hostname leaf certs (see
               plans/9_TLS_proxy.md). Uploading replaces whatever CA was active before; the private
               key itself is never sent back down to this page. -->
          <section class="card hidden" id="rootCaSection">
            <h2>Root CA</h2>
            <div id="rootCaStatus">Loading...</div>
            <form id="rootCaUploadForm">
              <div style="margin: 14px 0;">
                <label style="display:block; font-size:13px; color:var(--text-muted); margin-bottom:4px;">PFX file (cert + private key)</label>
                <input id="rootCaFile" type="file" accept=".pfx,.p12" required />
              </div>
              <div style="margin: 14px 0;">
                <label style="display:block; font-size:13px; color:var(--text-muted); margin-bottom:4px;">PFX password</label>
                <input id="rootCaPassword" type="password" />
              </div>
              <button type="submit" class="primary">Upload</button>
            </form>
            <div id="rootCaError" class="error-row"></div>
          </section>

          <!-- Video encoder mode for the server-side render pipeline (VideoTrackStreamer). GPU
               hardware encode isn't implemented yet (see plans/11_video_pipeline_speedup.md Step
               4) -- this only controls whether that gap is silently ignored (Auto, falls back to
               CPU) or surfaced loudly to the next video-mode session (Gpu, fails the session
               instead of a silent no-op). -->
          <section class="card hidden" id="settingsSection">
            <h2>Video encoder</h2>
            <div id="videoEncoderStatus">Loading...</div>
            <select id="videoEncoderMode" style="margin-top: 14px;">
              <option value="Auto">Auto</option>
              <option value="Cpu">CPU</option>
              <option value="Gpu">GPU</option>
            </select>
            <div id="videoEncoderError" class="error-row"></div>

            <h2 style="margin-top: 24px;">Log level</h2>
            <div id="logLevelStatus">Loading...</div>
            <select id="logLevel" style="margin-top: 14px;">
              <option value="Trace">Trace</option>
              <option value="Debug">Debug</option>
              <option value="Information">Information</option>
              <option value="Warning">Warning</option>
              <option value="Error">Error</option>
              <option value="Critical">Critical</option>
              <option value="None">None</option>
            </select>
            <div id="logLevelError" class="error-row"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script>
    // In-memory only: a page refresh loses the token and drops back to the login form. Deliberately
    // not persisted to localStorage/cookies — no refresh-token flow exists in this iteration, so
    // "session survives a refresh" isn't a requirement worth the added complexity/attack surface.
    let token = null;

    const loginBox = document.getElementById('loginBox');
    const mainBox = document.getElementById('mainBox');
    const loginHint = document.getElementById('loginHint');
    const loginError = document.getElementById('loginError');

    // Wrapper around fetch that attaches the bearer token and, on a 401 (expired/invalid/missing
    // token), drops the UI back to the login form instead of leaving the page in a broken state.
    async function authedFetch(url, options = {}) {
      const headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + token });
      const resp = await fetch(url, Object.assign({}, options, { headers }));
      if (resp.status === 401) {
        token = null;
        showLogin();
        throw new Error('Session expired, please log in again.');
      }
      return resp;
    }

    // Switches the visible view back to the login form and refreshes the bootstrap-vs-login hint.
    function showLogin() {
      mainBox.classList.add('hidden');
      loginBox.classList.remove('hidden');
      refreshLoginHint();
    }

    // Switches the visible view to the main admin UI and loads its two data tables.
    function showMain() {
      loginBox.classList.add('hidden');
      mainBox.classList.remove('hidden');
      loadSites();
      loadLogs();
      loadRootCa();
      loadVideoEncoderSetting();
      loadLogLevelSetting();
    }

    // Tracks the last-known bootstrap state so the login handler knows whether to demand a
    // matching confirm-password (bootstrap only — a returning admin already has one on file).
    let isBootstrapped = true;
    const passwordConfirm = document.getElementById('passwordConfirm');

    // Probes GET /api/admin/auth/status to tell a first-time operator (no admin yet, this login
    // will create one) apart from a returning admin (normal login). Also toggles the
    // confirm-password field: it's only relevant (and only shown) while no admin exists yet, since
    // that's the one login call that actually sets the password on file.
    async function refreshLoginHint() {
      try {
        const resp = await fetch('/api/admin/auth/status');
        const { bootstrapped } = await resp.json();
        isBootstrapped = bootstrapped;
        passwordConfirm.classList.toggle('hidden', bootstrapped);
        passwordConfirm.value = '';
        loginHint.textContent = bootstrapped
          ? 'Log in with your admin email and password.'
          : 'No admin exists yet — the first successful login here creates the admin account. Enter the new password twice.';
      } catch (e) {
        loginHint.textContent = 'Could not reach server: ' + e.message;
      }
    }

    // Enter in any login field submits, same as clicking loginBtn -- these inputs aren't inside a
    // <form>, so Enter wouldn't otherwise trigger anything.
    for (const el of [document.getElementById('email'), document.getElementById('password'), passwordConfirm]) {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('loginBtn').click();
        }
      });
    }

    document.getElementById('loginBtn').onclick = async () => {
      loginError.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        loginError.textContent = 'Email and password are required.';
        return;
      }
      // Confirmation only matters on bootstrap: this is the one login call that sets the password
      // on file, so a typo here would otherwise lock the operator out with no recovery path (no
      // "forgot password" flow exists in this iteration).
      if (!isBootstrapped && password !== passwordConfirm.value) {
        loginError.textContent = 'Passwords do not match.';
        return;
      }

      try {
        const resp = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!resp.ok) {
          loginError.textContent = 'Login failed (wrong credentials?).';
          return;
        }
        const { token: newToken } = await resp.json();
        token = newToken;
        showMain();
      } catch (e) {
        loginError.textContent = 'Login request failed: ' + e.message;
      }
    };

    document.getElementById('logoutBtn').onclick = () => {
      token = null;
      showLogin();
    };

    // Sidebar nav: shows the clicked section, hides the other, marks the clicked button active.
    // Data for both sections is already loaded eagerly by showMain() — this is pure visibility.
    document.querySelectorAll('.nav-item').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.content > section').forEach((s) => s.classList.toggle('hidden', s.id !== btn.dataset.section));
      };
    });

    // Renders the current SitePolicy list into #sitesBody, with an inline view-mode <select> (PUT on
    // change) and a delete button per row.
    async function loadSites() {
      const sitesBody = document.getElementById('sitesBody');
      sitesBody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';
      try {
        const resp = await authedFetch('/api/admin/sites');
        const sites = await resp.json();
        sitesBody.innerHTML = '';
        for (const site of sites) {
          sitesBody.appendChild(renderSiteRow(site));
        }
      } catch (e) {
        sitesBody.innerHTML = '<tr><td colspan="4" class="error-row">' + e.message + '</td></tr>';
      }
    }

    function renderSiteRow(site) {
      const tr = document.createElement('tr');

      const hostTd = document.createElement('td');
      hostTd.textContent = site.hostPattern;
      tr.appendChild(hostTd);

      const modeTd = document.createElement('td');
      const select = document.createElement('select');
      for (const mode of ['HtmlAllowInput', 'HtmlNoInput', 'VideoAllowInput', 'VideoNoInput']) {
        const opt = document.createElement('option');
        opt.value = mode;
        opt.textContent = mode;
        if (mode === site.viewMode) opt.selected = true;
        select.appendChild(opt);
      }
      select.onchange = async () => {
        try {
          await authedFetch('/api/admin/sites/' + site.id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hostPattern: site.hostPattern, viewMode: select.value }),
          });
        } catch (e) {
          alert('Failed to update: ' + e.message);
          loadSites();
        }
      };
      modeTd.appendChild(select);
      tr.appendChild(modeTd);

      const updatedTd = document.createElement('td');
      updatedTd.textContent = site.updatedAt;
      tr.appendChild(updatedTd);

      const actionsTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'danger';
      delBtn.textContent = 'Delete';
      delBtn.onclick = async () => {
        if (!confirm('Delete policy for ' + site.hostPattern + '?')) return;
        try {
          await authedFetch('/api/admin/sites/' + site.id, { method: 'DELETE' });
          loadSites();
        } catch (e) {
          alert('Failed to delete: ' + e.message);
        }
      };
      actionsTd.appendChild(delBtn);
      tr.appendChild(actionsTd);

      return tr;
    }

    document.getElementById('addSiteForm').onsubmit = async (e) => {
      e.preventDefault();
      const hostPattern = document.getElementById('newHost').value.trim();
      const viewMode = document.getElementById('newMode').value;
      if (!hostPattern) return;
      try {
        await authedFetch('/api/admin/sites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hostPattern, viewMode }),
        });
        document.getElementById('newHost').value = '';
        loadSites();
      } catch (e) {
        alert('Failed to add site: ' + e.message);
      }
    };

    // Renders the most recent request-log rows (newest first, matches the server's default order).
    async function loadLogs() {
      const logsBody = document.getElementById('logsBody');
      logsBody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
      try {
        const resp = await authedFetch('/api/admin/logs?limit=50&offset=0');
        const logs = await resp.json();
        logsBody.innerHTML = '';
        for (const entry of logs) {
          // Built with textContent, not innerHTML: url/host are logged from unauthenticated
          // /api/policy/resolve and /api/session/* calls, so they're attacker-influenced strings
          // that must never be interpreted as markup in the admin UI.
          const tr = document.createElement('tr');
          for (const value of [entry.timestamp, entry.url, entry.host, entry.decision, entry.allowed, entry.clientIp || '']) {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          }
          logsBody.appendChild(tr);
        }
      } catch (e) {
        logsBody.innerHTML = '<tr><td colspan="6" class="error-row">' + e.message + '</td></tr>';
      }
    }

    // Renders the active root CA's metadata (or "none configured"), plus download/delete controls
    // built fresh each time so their closures always reference the CA that's actually loaded.
    async function loadRootCa() {
      const status = document.getElementById('rootCaStatus');
      status.textContent = 'Loading...';
      try {
        const resp = await authedFetch('/api/admin/rootca');
        if (resp.status === 404) {
          status.textContent = 'No root CA is configured. Upload a PFX below to enable the TLS-intercepting proxy.';
          return;
        }
        const ca = await resp.json();
        status.innerHTML = '';

        const table = document.createElement('table');
        const rows = [
          ['Subject', ca.subject],
          ['Not before', ca.notBefore],
          ['Not after', ca.notAfter],
          ['Thumbprint', ca.thumbprint],
          ['Uploaded', ca.uploadedAt],
        ];
        const tbody = document.createElement('tbody');
        for (const [label, value] of rows) {
          const tr = document.createElement('tr');
          const th = document.createElement('th');
          th.textContent = label;
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(th);
          tr.appendChild(td);
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        status.appendChild(table);

        const actions = document.createElement('div');
        actions.style.marginTop = '12px';
        actions.style.display = 'flex';
        actions.style.gap = '8px';

        // A plain <a href> can't attach the bearer token, so the public cert is fetched as a blob
        // and downloaded via a throwaway object URL instead.
        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = 'Download public certificate';
        downloadBtn.onclick = async () => {
          try {
            const certResp = await authedFetch('/api/admin/rootca/certificate');
            const blob = await certResp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'rbi-root-ca.cer';
            a.click();
            URL.revokeObjectURL(url);
          } catch (e) {
            alert('Failed to download certificate: ' + e.message);
          }
        };
        actions.appendChild(downloadBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = async () => {
          if (!confirm('Delete the active root CA? The proxy will refuse all HTTPS interception until a new one is uploaded.')) return;
          try {
            await authedFetch('/api/admin/rootca', { method: 'DELETE' });
            loadRootCa();
          } catch (e) {
            alert('Failed to delete: ' + e.message);
          }
        };
        actions.appendChild(deleteBtn);

        status.appendChild(actions);
      } catch (e) {
        status.textContent = 'Failed to load: ' + e.message;
      }
    }

    document.getElementById('rootCaUploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const rootCaError = document.getElementById('rootCaError');
      rootCaError.textContent = '';
      const fileInput = document.getElementById('rootCaFile');
      const password = document.getElementById('rootCaPassword').value;
      if (!fileInput.files.length) {
        rootCaError.textContent = 'A PFX file is required.';
        return;
      }

      const formData = new FormData();
      formData.append('pfx', fileInput.files[0]);
      formData.append('password', password);

      try {
        const resp = await authedFetch('/api/admin/rootca', { method: 'POST', body: formData });
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          rootCaError.textContent = body.error || 'Upload failed.';
          return;
        }
        fileInput.value = '';
        document.getElementById('rootCaPassword').value = '';
        loadRootCa();
      } catch (e) {
        rootCaError.textContent = 'Upload request failed: ' + e.message;
      }
    };

    // Loads the current video encoder mode and detected-GPU status, and renders the status line
    // above the mode <select>. The select's current value is set to the stored mode but its
    // onchange handler (wired once below, outside this function) does the actual saving.
    async function loadVideoEncoderSetting() {
      const status = document.getElementById('videoEncoderStatus');
      status.textContent = 'Loading...';
      try {
        const resp = await authedFetch('/api/admin/settings/video-encoder');
        const setting = await resp.json();
        document.getElementById('videoEncoderMode').value = setting.mode;
        renderVideoEncoderStatus(setting);
      } catch (e) {
        status.textContent = 'Failed to load: ' + e.message;
      }
    }

    // Renders the detected-hardware line so the admin sees actual reality, not just the
    // configured wish -- same reasoning as the Root CA section showing the real cert metadata.
    function renderVideoEncoderStatus(setting) {
      const status = document.getElementById('videoEncoderStatus');
      status.textContent = 'GPU: ' + (setting.detectedGpu.available
        ? setting.detectedGpu.description
        : 'not detected (' + setting.detectedGpu.description + ')');
    }

    document.getElementById('videoEncoderMode').onchange = async (e) => {
      const videoEncoderError = document.getElementById('videoEncoderError');
      videoEncoderError.textContent = '';
      try {
        const resp = await authedFetch('/api/admin/settings/video-encoder', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: e.target.value }),
        });
        const setting = await resp.json();
        renderVideoEncoderStatus(setting);
      } catch (err) {
        videoEncoderError.textContent = 'Failed to save: ' + err.message;
        loadVideoEncoderSetting();
      }
    };

    // Loads the current server-wide log level and sets the <select>'s value. This level fully
    // replaces the appsettings.json Logging:LogLevel config for every category (not just a floor
    // on top of it) -- see AdminLogLevelSettingsEndpoints.
    async function loadLogLevelSetting() {
      const status = document.getElementById('logLevelStatus');
      status.textContent = 'Loading...';
      try {
        const resp = await authedFetch('/api/admin/settings/log-level');
        const setting = await resp.json();
        document.getElementById('logLevel').value = setting.level;
        status.textContent = 'Current level: ' + setting.level;
      } catch (e) {
        status.textContent = 'Failed to load: ' + e.message;
      }
    }

    document.getElementById('logLevel').onchange = async (e) => {
      const logLevelError = document.getElementById('logLevelError');
      const logLevelStatus = document.getElementById('logLevelStatus');
      logLevelError.textContent = '';
      try {
        const resp = await authedFetch('/api/admin/settings/log-level', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level: e.target.value }),
        });
        const setting = await resp.json();
        logLevelStatus.textContent = 'Current level: ' + setting.level;
      } catch (err) {
        logLevelError.textContent = 'Failed to save: ' + err.message;
        loadLogLevelSetting();
      }
    };

    refreshLoginHint();
  </script>
</body>
</html>
